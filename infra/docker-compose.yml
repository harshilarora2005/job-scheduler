version: "3.8"

# Local infra for job-scheduler. Run with: docker compose -f infra/docker-compose.yml up -d
# Brings up Postgres (job data), RabbitMQ (job.ready dispatch queue), and Kafka (job.events stream).
# Eureka server and the 4 Spring Boot services are run separately (see README / mvnw spring-boot:run).

services:
  postgres:
    image: postgres:16
    container_name: jobscheduler-postgres
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: jobscheduler-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI

  # Single-node Kafka in KRaft mode - no separate Zookeeper container needed.
  kafka:
    image: apache/kafka:3.8.0
    container_name: jobscheduler-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  pgdata:
