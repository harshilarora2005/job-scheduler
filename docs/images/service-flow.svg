<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f5e5a"/>
    </marker>
  </defs>

  <!-- Stage boxes: PENDING -> DISPATCHED -> RUNNING -> outcome -->
  <rect x="20" y="60" width="140" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="90" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">PENDING</text>
  <text x="90" y="99" text-anchor="middle" font-size="10" fill="#5f5e5a">job created by api-service</text>

  <rect x="210" y="60" width="140" height="56" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="280" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">DISPATCHED</text>
  <text x="280" y="99" text-anchor="middle" font-size="10" fill="#185fa5">scheduler-service dispatch cycle</text>

  <rect x="400" y="60" width="140" height="56" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="470" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">RUNNING</text>
  <text x="470" y="99" text-anchor="middle" font-size="10" fill="#185fa5">worker claims (SKIP LOCKED)</text>

  <!-- outcomes -->
  <rect x="640" y="10" width="150" height="52" rx="8" fill="#eaf3de" stroke="#639922" stroke-width="1"/>
  <text x="715" y="32" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">SUCCEEDED</text>
  <text x="715" y="48" text-anchor="middle" font-size="10" fill="#3b6d11">job completed</text>

  <rect x="640" y="80" width="150" height="52" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
  <text x="715" y="102" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">FAILED</text>
  <text x="715" y="118" text-anchor="middle" font-size="10" fill="#854f0b">retry w/ backoff</text>

  <rect x="640" y="150" width="150" height="52" rx="8" fill="#fcebeb" stroke="#e24b4a" stroke-width="1"/>
  <text x="715" y="172" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">DEAD</text>
  <text x="715" y="188" text-anchor="middle" font-size="10" fill="#a32d2d">max attempts exceeded</text>

  <!-- main flow arrows -->
  <path d="M160,88 L205,88" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M350,88 L395,88" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M540,80 C580,60 600,45 635,36" fill="none" stroke="#639922" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M540,95 C580,100 600,102 635,105" fill="none" stroke="#ba7517" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <path d="M700,132 C690,145 690,155 700,150" fill="none" stroke="#e24b4a" stroke-width="1.1" marker-end="url(#arrow2)"/>
  <text x="600" y="150" font-size="10" fill="#a32d2d">attempt_count &gt;= max</text>

  <!-- FAILED loops back to PENDING for retry -->
  <path d="M700,132 C500,220 200,220 95,116" fill="none" stroke="#ba7517" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="380" y="230" text-anchor="middle" font-size="10" fill="#854f0b">retry: back to PENDING (exponential backoff)</text>

  <!-- Lease reclaim path from RUNNING back to PENDING -->
  <path d="M420,116 C300,260 150,220 100,120" fill="none" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow2)"/>
  <text x="230" y="280" text-anchor="middle" font-size="10" fill="#5f5e5a">worker died: lease expires, scheduler-service reclaims</text>

  <!-- Kafka event stream row -->
  <rect x="200" y="330" width="560" height="56" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text x="480" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#26215c">job.events (Kafka)</text>
  <text x="480" y="369" text-anchor="middle" font-size="10" fill="#534ab7">every transition above is published here, keyed by jobType</text>

  <path d="M280,116 L360,330" fill="none" stroke="#7f77dd" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow2)"/>
  <path d="M470,116 L470,330" fill="none" stroke="#7f77dd" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow2)"/>
  <path d="M715,62 L560,330" fill="none" stroke="#7f77dd" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow2)"/>
  <path d="M715,132 L600,330" fill="none" stroke="#7f77dd" stroke-width="1" stroke-dasharray="2,3" marker-end="url(#arrow2)"/>

  <!-- dashboard consumes -->
  <rect x="360" y="420" width="240" height="0" fill="none"/>
  <path d="M480,386 L480,410" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow2)"/>
  <text x="480" y="430" text-anchor="middle" font-size="11" fill="#2c2c2a">dashboard-service: consumes stream, builds live /stats (no DB queries)</text>
</svg>
