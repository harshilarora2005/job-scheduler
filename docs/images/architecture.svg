<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="960" height="620" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5f5e5a"/>
    </marker>
    <marker id="arrowDashed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b4b2a9"/>
    </marker>
  </defs>

  <!-- Eureka server, top center -->
  <rect x="410" y="20" width="140" height="46" rx="8" fill="#eeedfe" stroke="#7f77dd" stroke-width="1"/>
  <text x="480" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#26215c">eureka-server</text>
  <text x="480" y="56" text-anchor="middle" font-size="10" fill="#534ab7">:8761 service registry</text>

  <!-- Services row -->
  <!-- api-service -->
  <rect x="20" y="140" width="170" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="105" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">api-service</text>
  <text x="105" y="180" text-anchor="middle" font-size="10" fill="#185fa5">:8080</text>
  <text x="105" y="193" text-anchor="middle" font-size="10" fill="#185fa5">POST /jobs</text>

  <!-- scheduler-service -->
  <rect x="230" y="140" width="170" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="315" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">scheduler-service</text>
  <text x="315" y="180" text-anchor="middle" font-size="10" fill="#185fa5">:8081</text>
  <text x="315" y="193" text-anchor="middle" font-size="10" fill="#185fa5">dispatch + lease reclaim</text>

  <!-- worker-service (multiple instances) -->
  <rect x="450" y="150" width="170" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <rect x="442" y="142" width="170" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <rect x="434" y="134" width="170" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1.5"/>
  <text x="519" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">worker-service</text>
  <text x="519" y="174" text-anchor="middle" font-size="10" fill="#185fa5">N instances (random ports)</text>
  <text x="519" y="187" text-anchor="middle" font-size="10" fill="#185fa5">SKIP LOCKED claim + execute</text>

  <!-- dashboard-service -->
  <rect x="660" y="140" width="180" height="60" rx="8" fill="#e6f1fb" stroke="#378add" stroke-width="1"/>
  <text x="750" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#042c53">dashboard-service</text>
  <text x="750" y="180" text-anchor="middle" font-size="10" fill="#185fa5">:8083</text>
  <text x="750" y="193" text-anchor="middle" font-size="10" fill="#185fa5">live stats + dashboard UI</text>

  <!-- Eureka registration lines (dashed) from each service -->
  <path d="M105,140 C105,90 350,66 415,55" fill="none" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <path d="M330,140 C350,110 400,80 420,58" fill="none" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <path d="M519,134 C519,100 500,75 480,66" fill="none" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <path d="M750,140 C750,95 580,66 545,52" fill="none" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>

  <!-- Infra row -->
  <!-- Postgres -->
  <rect x="60" y="330" width="160" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="140" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">PostgreSQL</text>
  <text x="140" y="369" text-anchor="middle" font-size="10" fill="#5f5e5a">jobs, dead_letter_jobs</text>

  <!-- RabbitMQ -->
  <rect x="290" y="330" width="160" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="370" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">RabbitMQ</text>
  <text x="370" y="369" text-anchor="middle" font-size="10" fill="#5f5e5a">job.ready queue</text>

  <!-- Kafka -->
  <rect x="520" y="330" width="160" height="56" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="1"/>
  <text x="600" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2a">Kafka</text>
  <text x="600" y="369" text-anchor="middle" font-size="10" fill="#5f5e5a">job.events (3 partitions)</text>

  <!-- Client -->
  <rect x="750" y="330" width="150" height="56" rx="8" fill="#faeeda" stroke="#ba7517" stroke-width="1"/>
  <text x="825" y="353" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">client / k6</text>
  <text x="825" y="369" text-anchor="middle" font-size="10" fill="#854f0b">load test / curl</text>

  <!-- Arrows: services -> infra -->
  <path d="M105,200 L140,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="95" y="270" font-size="10" fill="#5f5e5a">write PENDING</text>

  <path d="M315,200 L200,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="220" y="270" font-size="10" fill="#5f5e5a">poll + dispatch</text>

  <path d="M340,200 L360,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="345" y="255" font-size="10" fill="#5f5e5a">publish job.ready</text>

  <path d="M370,200 L580,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="420" y="240" font-size="10" fill="#5f5e5a">publish DISPATCHED</text>

  <path d="M480,210 L380,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="410" y="290" font-size="10" fill="#5f5e5a">consume job.ready</text>

  <path d="M519,210 L200,340" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="270" y="330" font-size="10" fill="#5f5e5a">claim / execute</text>

  <path d="M560,210 L610,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="555" y="260" font-size="10" fill="#5f5e5a">publish RUNNING/SUCCEEDED/FAILED</text>

  <path d="M700,200 L640,330" fill="none" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="690" y="270" font-size="10" fill="#5f5e5a">consume job.events</text>

  <path d="M825,330 L120,200" fill="none" stroke="#ba7517" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="640" y="230" font-size="10" fill="#854f0b">POST /jobs</text>

  <!-- Legend -->
  <rect x="20" y="440" width="14" height="14" fill="#e6f1fb" stroke="#378add"/>
  <text x="40" y="451" font-size="11" fill="#2c2c2a">Spring Boot service</text>

  <rect x="180" y="440" width="14" height="14" fill="#f1efe8" stroke="#888780"/>
  <text x="200" y="451" font-size="11" fill="#2c2c2a">infrastructure</text>

  <rect x="320" y="440" width="14" height="14" fill="#faeeda" stroke="#ba7517"/>
  <text x="340" y="451" font-size="11" fill="#2c2c2a">external caller</text>

  <line x1="460" y1="447" x2="490" y2="447" stroke="#5f5e5a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="498" y="451" font-size="11" fill="#2c2c2a">data / event flow</text>

  <line x1="640" y1="447" x2="670" y2="447" stroke="#b4b2a9" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrowDashed)"/>
  <text x="678" y="451" font-size="11" fill="#2c2c2a">Eureka registration</text>
</svg>
